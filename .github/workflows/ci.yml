name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.15"
          cache: true

      - name: Install dependencies
        run: make install_deps

      - name: Check formatting
        run: make fmt

      - name: Lint
        run: |
          GOBIN="$(go env GOPATH)/bin" go install github.com/golangci/golangci-lint/cmd/golangci-lint@v2.1.6
          export PATH="$(go env GOPATH)/bin:$PATH"
          make lint

      - name: Run tests
        run: make test

      - name: Build
        run: go build ./...

      - name: Clean up
        run: make clean